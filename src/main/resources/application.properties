quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-form-attribute-size=600K

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FASHION_LENS_CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Accept,Content-Type
quarkus.http.cors.access-control-max-age=24H

quarkus.smallrye-openapi.info-title=Fashion Lens API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Fashion Lens product search API. Configure SerpApi for live shopping and visual results.

fashion-lens.serpapi.api-key=${SERPAPI_KEY:not-configured}
fashion-lens.serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com}
